# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Examtie Backend API Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: examtie_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      working-directory: ./Backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Wait for services to be ready
      run: |
        echo "⏳ Waiting for MongoDB to be ready..."
        timeout 60 bash -c 'until nc -z localhost 27017; do sleep 1; done'
        echo "✅ MongoDB is ready"
        
        echo "⏳ Waiting for Redis to be ready..."
        timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'
        echo "✅ Redis is ready"

    - name: Create CI test configuration
      working-directory: ./Backend
      run: |
        echo "📝 Creating CI test configuration..."
        cat > ci_test_env.py << 'EOF'
        # CI Test Environment Configuration
        import os
        
        # Override environment variables for CI
        os.environ.update({
            'MONGO_URI': 'mongodb://admin:password@localhost:27017/examtie_test?authSource=admin',
            'DATABASE_NAME': 'examtie_test',
            'REDIS_URL_KRUB': 'redis://localhost:6379',
            'REDIS_PASSWORD': '',
            'REDIS_DB': '0',
            'SECRET_KEY': 'test-secret-key-for-github-actions',
            'ALGORITHM': 'HS256',
            'ACCESS_TOKEN_EXPIRE_MINUTES_SECONDS': '43200',
            'CACHE_EXPIRE_SECONDS': '3600',
            'STREAK_TTL_SECONDS': '5184000'
        })
        
        print("✅ CI environment configured")
        print(f"MongoDB URI: {os.environ['MONGO_URI']}")
        print(f"Redis URL: {os.environ['REDIS_URL_KRUB']}")
        EOF
        
        python ci_test_env.py

    - name: Set environment variables
      working-directory: ./Backend
      run: |
        echo "MONGO_URI=mongodb://admin:password@localhost:27017/examtie_test?authSource=admin" >> $GITHUB_ENV
        echo "DATABASE_NAME=examtie_test" >> $GITHUB_ENV
        echo "REDIS_URL_KRUB=redis://localhost:6379" >> $GITHUB_ENV
        echo "REDIS_PASSWORD=" >> $GITHUB_ENV
        echo "REDIS_DB=0" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
        echo "ALGORITHM=HS256" >> $GITHUB_ENV
        echo "ACCESS_TOKEN_EXPIRE_MINUTES_SECONDS=43200" >> $GITHUB_ENV
        echo "CACHE_EXPIRE_SECONDS=3600" >> $GITHUB_ENV
        echo "STREAK_TTL_SECONDS=5184000" >> $GITHUB_ENV

    - name: Verify service connections
      working-directory: ./Backend
      run: |
        echo "🔍 Testing MongoDB connection..."
        python -c "
        import pymongo
        try:
            client = pymongo.MongoClient('mongodb://admin:password@localhost:27017/examtie_test?authSource=admin', serverSelectionTimeoutMS=10000)
            client.server_info()
            # Test database creation
            db = client['examtie_test']
            db.test_collection.insert_one({'test': 'data'})
            db.test_collection.delete_one({'test': 'data'})
            print('✅ MongoDB connection and database operations successful')
        except Exception as e:
            print(f'❌ MongoDB connection failed: {e}')
            exit(1)
        "
        
        echo "🔍 Testing Redis connection..."
        python -c "
        import redis
        try:
            r = redis.Redis(host='localhost', port=6379, db=0, decode_responses=True)
            r.ping()
            # Test basic operations
            r.set('test_key', 'test_value')
            value = r.get('test_key')
            r.delete('test_key')
            print(f'✅ Redis connection successful, test value: {value}')
        except Exception as e:
            print(f'❌ Redis connection failed: {e}')
            exit(1)
        "

    - name: Test application configuration
      working-directory: ./Backend
      run: |
        echo "⚙️ Testing application configuration..."
        python -c "
        import sys
        sys.path.insert(0, '.')
        
        # Import and test app settings
        from app.settings import MONGO_URI, DATABASE_NAME, REDIS_URL, SECRET_KEY
        from app.database import client as mongo_client, redis_client
        import asyncio
        
        print(f'Configured MONGO_URI: {MONGO_URI}')
        print(f'Configured DATABASE_NAME: {DATABASE_NAME}')
        print(f'Configured REDIS_URL: {REDIS_URL}')
        print(f'SECRET_KEY configured: {\"Yes\" if SECRET_KEY else \"No\"}')
        
        async def test_app_connections():
            try:
                # Test MongoDB through app database module
                await mongo_client.admin.command('ping')
                print('✅ App MongoDB connection working')
                
                # Test Redis through app database module
                await redis_client.ping()
                print('✅ App Redis connection working')
                
                # Test collections access
                from app.database import users_collection
                count = await users_collection.count_documents({})
                print(f'✅ Users collection accessible, count: {count}')
                
            except Exception as e:
                print(f'❌ App configuration test failed: {e}')
                raise
        
        asyncio.run(test_app_connections())
        print('✅ Application configuration test passed')
        "

    - name: Initialize database
      working-directory: ./Backend
      run: |
        echo "🗄️ Setting up database with admin user..."
        python setup_database.py
        
        echo "🔍 Verifying admin user creation..."
        python -c "
        import pymongo
        client = pymongo.MongoClient('mongodb://admin:password@localhost:27017/examtie_test?authSource=admin')
        db = client['examtie_test']
        admin_user = db.users.find_one({'email': 'admin@admin.com'})
        if admin_user:
            print('✅ Admin user created successfully')
            print(f'   Admin roles: {admin_user.get(\"roles\", [])}')
        else:
            print('❌ Admin user not found')
            exit(1)
        "

    - name: Run comprehensive service tests
      working-directory: ./Backend
      run: |
        echo "🧪 Running comprehensive service tests..."
        python -c "
        import asyncio
        import pymongo
        import redis
        import redis.asyncio as redis_async
        from motor.motor_asyncio import AsyncIOMotorClient
        
        async def test_async_connections():
            print('🔍 Testing async MongoDB connection...')
            mongo_client = AsyncIOMotorClient('mongodb://admin:password@localhost:27017/examtie_test?authSource=admin')
            try:
                await mongo_client.admin.command('ping')
                db = mongo_client['examtie_test']
                # Test basic operations
                await db.test_collection.insert_one({'test': 'async_test'})
                doc = await db.test_collection.find_one({'test': 'async_test'})
                await db.test_collection.delete_one({'test': 'async_test'})
                print(f'✅ Async MongoDB working, test doc: {doc}')
            except Exception as e:
                print(f'❌ Async MongoDB failed: {e}')
                raise
            finally:
                mongo_client.close()
            
            print('🔍 Testing async Redis connection...')
            redis_client = redis_async.from_url('redis://localhost:6379/0', decode_responses=True)
            try:
                await redis_client.ping()
                await redis_client.set('async_test', 'async_value', ex=60)
                value = await redis_client.get('async_test')
                await redis_client.delete('async_test')
                print(f'✅ Async Redis working, test value: {value}')
            except Exception as e:
                print(f'❌ Async Redis failed: {e}')
                raise
            finally:
                await redis_client.close()
        
        # Run async tests
        asyncio.run(test_async_connections())
        print('✅ All async service tests passed')
        "

    - name: Run unit tests
      working-directory: ./Backend
      run: |
        echo "🧪 Running unit tests..."
        python -m pytest tests/unit/ -v --tb=short

    - name: Start API server in background
      working-directory: ./Backend
      run: |
        echo "🚀 Starting API server..."
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        echo $! > server.pid
        
        # Wait for server to start
        echo "⏳ Waiting for server to start..."
        timeout 60 bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
        echo "✅ Server is ready"
        
        # Test server health endpoint
        echo "🩺 Testing server health..."
        health_response=$(curl -s http://localhost:8000/health)
        echo "Health response: $health_response"
        
        # Verify server is actually responding correctly
        if curl -s http://localhost:8000/ | grep -q "Examtie"; then
          echo "✅ Server responding correctly"
        else
          echo "❌ Server not responding correctly"
          exit 1
        fi

    - name: Test API endpoints
      working-directory: ./Backend
      run: |
        echo "🌐 Testing API endpoints..."
        
        # Test root endpoint
        echo "Testing root endpoint..."
        response=$(curl -s http://localhost:8000/)
        echo "Root response: $response"
        if echo "$response" | grep -q "Examtie Backend API"; then
          echo "✅ Root endpoint working"
        else
          echo "❌ Root endpoint failed"
          exit 1
        fi
        
        # Test health endpoint
        echo "Testing health endpoint..."
        health_response=$(curl -s http://localhost:8000/health)
        echo "Health response: $health_response"
        # Test health endpoint
        echo "Testing health endpoint..."
        health_response=$(curl -s http://localhost:8000/health)
        echo "Health response: $health_response"
        if echo "$health_response" | grep -q "status"; then
          echo "✅ Health endpoint working"
        else
          echo "❌ Health endpoint failed"
          exit 1
        fi
        
        # Test database operations through the application
        echo "🗄️ Testing database operations through application..."
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')
        
        async def test_db_operations():
            from app.database import users_collection, redis_client
            from app.dependencies import get_user_by_email, _cache_user
            
            # Test user lookup (should find admin user)
            admin_user = await get_user_by_email('admin@admin.com')
            if admin_user:
                print(f'✅ Admin user found: {admin_user[\"email\"]}')
                print(f'   Roles: {admin_user.get(\"roles\", [])}')
                
                # Test Redis caching
                await _cache_user(admin_user)
                print('✅ User caching successful')
                
                # Test Redis retrieval
                cached_user = await get_user_by_email('admin@admin.com')
                if cached_user:
                    print('✅ User retrieval from cache successful')
                else:
                    print('❌ User retrieval from cache failed')
                    raise Exception('Cache retrieval failed')
            else:
                print('❌ Admin user not found')
                raise Exception('Admin user not found')
        
        asyncio.run(test_db_operations())
        print('✅ All database operations test passed')
        "
        
        # Test admin login
        echo "Testing admin login..."
        login_response=$(curl -s -X POST http://localhost:8000/auth/api/v1/login \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "username=admin@admin.com&password=admin@admin.com")
        
        echo "Login response: $login_response"
        
        ADMIN_TOKEN=$(echo "$login_response" | python -c "
        import sys, json
        try:
            data = json.load(sys.stdin)
            print(data['access_token'])
        except:
            print('')
        " 2>/dev/null)
        
        if [ -n "$ADMIN_TOKEN" ] && [ "$ADMIN_TOKEN" != "null" ]; then
          echo "✅ Admin login successful"
          echo "Token (first 20 chars): ${ADMIN_TOKEN:0:20}..."
        else
          echo "❌ Failed to get admin token"
          echo "Full login response: $login_response"
          exit 1
        fi
        
        # Test protected endpoint
        echo "Testing protected admin endpoint..."
        admin_response=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
          http://localhost:8000/admin/api/v1/users)
        
        echo "Admin endpoint response: $admin_response"
        
        if echo "$admin_response" | grep -q "users" || echo "$admin_response" | grep -q "\[\]"; then
          echo "✅ Protected endpoint accessible"
        else
          echo "❌ Protected endpoint failed"
          echo "Response: $admin_response"
          exit 1
        fi

    - name: Run integration tests
      working-directory: ./Backend
      run: |
        echo "🔧 Running integration tests..."
        
        # Create a comprehensive integration test
        python -c "
        import requests
        import json
        import asyncio
        import sys
        sys.path.insert(0, '.')
        
        BASE_URL = 'http://localhost:8000'
        
        def test_complete_flow():
            print('🧪 Testing complete application flow...')
            
            # 1. Test root endpoint
            response = requests.get(f'{BASE_URL}/')
            assert response.status_code == 200, f'Root endpoint failed: {response.status_code}'
            print('✅ Root endpoint working')
            
            # 2. Test health endpoint
            response = requests.get(f'{BASE_URL}/health')
            assert response.status_code == 200, f'Health endpoint failed: {response.status_code}'
            print('✅ Health endpoint working')
            
            # 3. Test admin login
            login_data = {'username': 'admin@admin.com', 'password': 'admin@admin.com'}
            response = requests.post(f'{BASE_URL}/auth/api/v1/login', data=login_data)
            assert response.status_code == 200, f'Admin login failed: {response.status_code}'
            token = response.json()['access_token']
            print('✅ Admin login successful')
            
            # 4. Test protected admin endpoint
            headers = {'Authorization': f'Bearer {token}'}
            response = requests.get(f'{BASE_URL}/admin/api/v1/users', headers=headers)
            assert response.status_code == 200, f'Admin users endpoint failed: {response.status_code}'
            users = response.json()
            print(f'✅ Admin users endpoint working, found {len(users)} users')
            
            # 5. Test admin stats
            response = requests.get(f'{BASE_URL}/admin/api/v1/stats', headers=headers)
            assert response.status_code == 200, f'Admin stats endpoint failed: {response.status_code}'
            stats = response.json()
            print(f'✅ Admin stats endpoint working: {stats}')
            
            print('✅ Complete application flow test passed')
        
        test_complete_flow()
        "
        
        # Run pytest integration tests if they exist
        if [ -d "tests/integration" ]; then
          echo "🧪 Running pytest integration tests..."
          python -m pytest tests/integration/ -v --tb=short
        else
          echo "⚠️ No integration test directory found, skipping pytest integration tests"
        fi

    - name: Run performance tests
      working-directory: ./Backend
      run: |
        echo "⚡ Running performance tests..."
        
        # Basic performance test
        python -c "
        import requests
        import time
        import concurrent.futures
        
        BASE_URL = 'http://localhost:8000'
        
        def test_endpoint_performance():
            start_time = time.time()
            response = requests.get(f'{BASE_URL}/')
            end_time = time.time()
            response_time = end_time - start_time
            
            assert response.status_code == 200, f'Performance test failed: {response.status_code}'
            print(f'Root endpoint response time: {response_time:.3f}s')
            
            # Test concurrent requests
            def make_request():
                return requests.get(f'{BASE_URL}/health')
            
            start_time = time.time()
            with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
                futures = [executor.submit(make_request) for _ in range(10)]
                responses = [future.result() for future in futures]
            end_time = time.time()
            
            all_success = all(r.status_code == 200 for r in responses)
            total_time = end_time - start_time
            
            assert all_success, 'Some concurrent requests failed'
            print(f'10 concurrent requests completed in {total_time:.3f}s')
            print('✅ Performance tests passed')
        
        test_endpoint_performance()
        "
        
        # Run pytest performance tests if they exist
        if [ -d "tests/performance" ]; then
          echo "🧪 Running pytest performance tests..."
          python -m pytest tests/performance/ -v --tb=short
        else
          echo "⚠️ No performance test directory found, skipping pytest performance tests"
        fi

    - name: Final configuration verification
      working-directory: ./Backend
      if: always()
      run: |
        echo "🔍 Final configuration verification..."
        
        python -c "
        import sys
        import os
        sys.path.insert(0, '.')
        
        # Verify all environment variables are set correctly
        required_vars = [
            'MONGO_URI', 'DATABASE_NAME', 'REDIS_URL_KRUB', 
            'SECRET_KEY', 'ALGORITHM', 'ACCESS_TOKEN_EXPIRE_MINUTES_SECONDS'
        ]
        
        print('Environment Variables:')
        for var in required_vars:
            value = os.getenv(var, 'NOT SET')
            # Don't print sensitive values in full
            if 'SECRET' in var or 'PASSWORD' in var:
                print(f'  {var}: {\"SET\" if value != \"NOT SET\" else \"NOT SET\"}')
            else:
                print(f'  {var}: {value}')
        
        # Test final import of all critical modules
        try:
            from app.settings import MONGO_URI, DATABASE_NAME, REDIS_URL
            from app.database import client, redis_client, users_collection
            from app.dependencies import get_user_by_email
            from app.auth import hash_password, verify_password
            print('✅ All critical modules imported successfully')
        except Exception as e:
            print(f'❌ Critical module import failed: {e}')
            sys.exit(1)
        
        print('✅ Final configuration verification passed')
        "

    - name: Stop API server
      working-directory: ./Backend
      if: always()
      run: |
        if [ -f server.pid ]; then
          echo "🛑 Stopping API server..."
          SERVER_PID=$(cat server.pid)
          
          # Try graceful shutdown first
          kill -TERM $SERVER_PID 2>/dev/null || true
          sleep 5
          
          # Force kill if still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server still running, force killing..."
            kill -KILL $SERVER_PID 2>/dev/null || true
          fi
          
          rm server.pid
          echo "✅ Server stopped"
        else
          echo "⚠️ Server PID file not found"
        fi
        
        # Capture any remaining logs
        echo "📋 Server logs (if any):"
        if [ -f app.log ]; then
          tail -20 app.log || true
        fi

    - name: Upload test results and logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-python${{ matrix.python-version }}
        path: |
          Backend/pytest_results.xml
          Backend/*.log
          Backend/server.pid
        retention-days: 7